name: Nanvix CI

on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [cpython-release]
  push:
    branches: ["main", "nanvix/**"]
  pull_request:
    branches: ["main", "nanvix/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref || 'default' }}
  cancel-in-progress: true

jobs:
  ci:
    uses: nanvix/workflows/.github/workflows/nanvix-ci.yml@v1.8.0
    with:
      zutil-version: "v0.7.21"
      platforms: '["microvm"]'
      process-modes: '["multi-process", "single-process", "standalone"]'
      memory-sizes: '["256mb"]'
      caller-event-name: ${{ github.event_name }}
      release-notes-extra: |
        CPython 3.12.3 distribution for Nanvix with 8 statically linked C extensions
        and 108 pip packages.
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------
  # Create a Windows zip release asset.
  # The reusable workflow creates a GitHub release with .tar.bz2 assets
  # (Linux). This job downloads the standalone tarball, extracts
  # python3.12 + site-packages, builds a stripped ramfs, and uploads a
  # flat .zip with {python.elf, cpython-ramfs.img} to the same release.
  # On Windows, consumers combine this with nanvixd.exe from the Nanvix
  # release to run scripts.
  # -------------------------------------------------------------------
  windows-zip:
    needs: ci
    if: >-
      !cancelled() &&
      needs.ci.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.ci.outputs.package_version }}-nanvix-${{ needs.ci.outputs.nanvix_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Download standalone tarball from release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-download
          echo "Release tag: $RELEASE_TAG"
          sleep 5
          # Retry download with backoff — the release may take a moment
          # to propagate after the CI job creates it.
          for attempt in 1 2 3 4 5; do
            gh release download "$RELEASE_TAG" --pattern "*standalone*.tar.bz2" --dir release-download && break
            echo "Attempt $attempt failed, retrying in ${attempt}0s..."
            sleep "$((attempt * 10))"
          done
          ls -la release-download/

      - name: Create Windows zip
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Find the main standalone tarball (not buildroot)
          TARBALL=$(find release-download -name "*standalone*.tar.bz2" ! -name "*buildroot*" | head -1)
          if [[ -z "$TARBALL" ]]; then
            echo "::error::No standalone tarball found in release $RELEASE_TAG after retries"
            exit 1
          fi
          echo "Using tarball: $TARBALL"

          mkdir -p extract windows-zip
          tar -xjf "$TARBALL" -C extract

          # Find python binary
          PYTHON_BIN=$(find extract -name "python3.12" -type f | head -1)
          if [[ -z "$PYTHON_BIN" ]]; then
            PYTHON_BIN=$(find extract -name "python.elf" -type f | head -1)
          fi
          if [[ -z "$PYTHON_BIN" ]]; then
            echo "::error::Could not find python binary in standalone tarball"
            find extract -type f | head -20
            exit 1
          fi
          cp "$PYTHON_BIN" windows-zip/python.elf
          echo "Included: python.elf ($(stat -c%s windows-zip/python.elf) bytes)"

          # Build ramfs from the sysroot in the tarball
          SYSROOT=$(find extract -type d -name "sysroot" | head -1)
          if [[ -z "$SYSROOT" ]]; then
            echo "::warning::No sysroot found in tarball"
            exit 0
          fi

          PYLIB="${SYSROOT}/lib/python3.12"
          echo "Building ramfs from: $PYLIB"

          # Trim (same as z.py _create_stripped_sysroot)
          find "$SYSROOT" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$SYSROOT" -name "*.pyc" -delete 2>/dev/null || true
          rm -rf "$SYSROOT/bin" "$SYSROOT/include" "$SYSROOT/share" "$SYSROOT/lib/pkgconfig"
          for d in test tests idlelib tkinter ensurepip lib2to3 turtledemo pydoc_data; do
            rm -rf "$PYLIB/$d" 2>/dev/null || true
          done
          # Strip heavy packages (same list as z.py)
          SITE="${PYLIB}/site-packages"
          for pkg in plotly jupyterlab_plotly sympy nltk reportlab share textblob joblib; do
            rm -rf "$SITE/$pkg" "$SITE/${pkg}-"*.dist-info 2>/dev/null || true
          done
          find "$SITE" \( -name "*.pyx" -o -name "*.pxd" -o -name "*.c" -o -name "*.h" -o -name "*.cpp" \) \
            -exec rm -f {} + 2>/dev/null || true

          echo "Trimmed sysroot: $(du -sh "$SYSROOT" | cut -f1)"

          # Get mkramfs from Nanvix release via a pinned, verified helper script.
          GET_NANVIX_REF="10b0dac7b19bf52918b7058ccf117e14bd910727"
          GET_NANVIX_SHA256="4d4a5be9232cd10c026bdfbcd2ce0ca728ac1e08ce9e185b65b1bfaddf7ca554"
          curl -fsSLo get-nanvix.sh \
            "https://raw.githubusercontent.com/nanvix/nanvix/${GET_NANVIX_REF}/scripts/get-nanvix.sh"
          echo "${GET_NANVIX_SHA256}  get-nanvix.sh" | sha256sum -c -
          bash get-nanvix.sh --force nanvix-dl
          MKRAMFS=""
          NVX_TAR=$(find nanvix-dl -name "nanvix-*microvm-standalone-*.tar.bz2" ! -name "*windows*" | head -1)
          if [[ -n "$NVX_TAR" ]]; then
            mkdir -p nanvix-extract
            tar -xjf "$NVX_TAR" -C nanvix-extract
            MKRAMFS=$(find nanvix-extract -name "mkramfs.elf" -type f | head -1)
          fi

          if [[ -n "$MKRAMFS" ]]; then
            chmod +x "$MKRAMFS"
            STAGING_PARENT=$(dirname "$SYSROOT")
            "$MKRAMFS" -o windows-zip/cpython-ramfs.img "$STAGING_PARENT"
            echo "Included: cpython-ramfs.img ($(stat -c%s windows-zip/cpython-ramfs.img) bytes)"
          else
            echo "::warning::mkramfs not found — zip will not contain ramfs"
          fi

          ZIP_NAME="nanvix-python-windows-microvm-standalone-256mb-${GITHUB_SHA::7}.zip"
          (cd windows-zip && zip "../${ZIP_NAME}" *)
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "Created: $ZIP_NAME ($(stat -c%s "$ZIP_NAME") bytes)"
          unzip -l "$ZIP_NAME"

      - name: Upload zip to release
        if: ${{ env.zip_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" "${{ env.zip_name }}" --clobber
          echo "Uploaded ${{ env.zip_name }} to release $RELEASE_TAG"
