name: Nanvix CI

on:
  schedule:
    - cron: "0 14 * * *"
  repository_dispatch:
    types: [cpython-release]
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "nanvix/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref || 'default' }}
  cancel-in-progress: true

jobs:
  ci:
    uses: nanvix/workflows/.github/workflows/nanvix-ci.yml@v2.6.0
    with:
      platforms: '["microvm"]'
      process-modes: '["standalone"]'
      memory-sizes: '["256mb"]'
      skip-full-test-modes: "[]"
      caller-event-name: ${{ github.event_name }}
      windows-test: true
      windows-release: true
      use-release-sha: true
      python-paths: ".nanvix/z.py tests/smoke_test_l2.py"
      yaml-paths: ".github/workflows/ci.yml"
      release-notes-extra: |
        CPython 3.12.3 distribution for Nanvix with pure Python pip packages.
      test-output-globs: '["nanvix_rootfs.img"]'
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
